name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: postgresql://coffee:coffee@localhost:5440/coffee
  AUTH_SECRET: ci-only-secret
  PAYMENT_CALLBACK_SECRET: ci-only-callback-secret
  RATE_LIMIT_DISABLED: "true"

jobs:
  checks:
    name: Lint, types, unit tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        ports: ["5440:5432"]
        env: { POSTGRES_USER: coffee, POSTGRES_PASSWORD: coffee, POSTGRES_DB: coffee }
        options: >-
          --health-cmd "pg_isready -U coffee" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npx prettier --check .
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm audit --audit-level=high --omit=dev

  e2e:
    name: End-to-end (build + Playwright)
    runs-on: ubuntu-latest
    needs: checks
    services:
      postgres:
        image: postgres:16
        ports: ["5440:5432"]
        env: { POSTGRES_USER: coffee, POSTGRES_PASSWORD: coffee, POSTGRES_DB: coffee }
        options: >-
          --health-cmd "pg_isready -U coffee" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npx prisma migrate deploy
      - run: npx prisma db seed
        env: { SEED_ORDERS: "3000" }
      - run: npm run build
      - run: npx playwright install --with-deps chrome
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7

  design-system:
    name: Storybook and accessibility of every story
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run build-storybook
      - run: npx playwright install --with-deps chrome
      - run: npm run test:stories

  commits:
    name: Commit messages
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }}
