<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background Espresso Base -->
    <rect id="bg" width="1200" height="630" fill="#1C1612" />

    <!-- Soft ember radial glow on the left -->
    <radialGradient id="emberGlow" cx="30%" cy="50%" r="55%" fx="28%" fy="50%">
      <stop offset="0%" stop-color="#E4572E" stop-opacity="0.38" />
      <stop offset="35%" stop-color="#C2410C" stop-opacity="0.22" />
      <stop offset="65%" stop-color="#6B5748" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#1C1612" stop-opacity="0" />
    </radialGradient>

    <!-- Deep inner bean glow -->
    <radialGradient id="beanSubtleGlow" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="65%" stop-color="#FAF6F1" />
      <stop offset="100%" stop-color="#EADBCC" />
    </radialGradient>

    <!-- Ember Crease Gradients -->
    <linearGradient id="creaseOuter" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E4572E" />
      <stop offset="50%" stop-color="#C2410C" />
      <stop offset="100%" stop-color="#9B2F00" />
    </linearGradient>

    <radialGradient id="creaseHotCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFA15C" />
      <stop offset="40%" stop-color="#E4572E" />
      <stop offset="100%" stop-color="#C2410C" stop-opacity="0" />
    </radialGradient>

    <!-- Filter for subtle organic glow on crease core -->
    <filter id="softCreaseGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- 1. Background -->
  <rect width="1200" height="630" fill="#1C1612" />

  <!-- 2. Soft Ember Radial Glow on the Left -->
  <rect width="1200" height="630" fill="url(#emberGlow)" />

  <!-- 3. Left Side: Large Crema Bean (Rotated 28°) -->
  <!-- Center around x: 360, y: 315 -->
  <g transform="translate(360, 315) rotate(28)">
    <!-- Crema Bean Outer Shadow / Ambient Warmth -->
    <ellipse
      cx="0"
      cy="0"
      rx="146"
      ry="212"
      fill="#0E0A08"
      opacity="0.4"
      transform="translate(6, 14)"
    />

    <!-- Crema Bean Body -->
    <!-- Authentic coffee bean organic contour -->
    <path
      d="M 0, -205 
             C 95, -200 152, -125 152, 0 
             C 152, 125 95, 200 0, 205 
             C -95, 200 -152, 125 -152, 0 
             C -152, -125 -95, -200 0, -205 Z"
      fill="url(#beanSubtleGlow)"
    />

    <!-- Subtle Crema Edge Rim / Dimension -->
    <path
      d="M 0, -205 
             C 95, -200 152, -125 152, 0 
             C 152, 125 95, 200 0, 205 
             C -95, 200 -152, 125 -152, 0 
             C -152, -125 -95, -200 0, -205 Z"
      fill="none"
      stroke="#EADBCC"
      stroke-width="3"
      opacity="0.8"
    />

    <!-- S-Crease Channel Base (Carved groove) -->
    <path
      d="M 0, -182 
             C 44, -100 48, -35 8, 8 
             C -38, 48 -40, 110 0, 182"
      fill="none"
      stroke="#52220F"
      stroke-width="26"
      stroke-linecap="round"
      opacity="0.9"
    />

    <!-- S-Crease Ember Glow Base -->
    <path
      d="M 0, -182 
             C 44, -100 48, -35 8, 8 
             C -38, 48 -40, 110 0, 182"
      fill="none"
      stroke="url(#creaseOuter)"
      stroke-width="16"
      stroke-linecap="round"
    />

    <!-- Crease Hot Core (#FFA15C core) with luminous glow -->
    <path
      d="M 0, -178 
             C 42, -98 46, -33 8, 8 
             C -36, 46 -38, 108 0, 178"
      fill="none"
      stroke="#FFA15C"
      stroke-width="7"
      stroke-linecap="round"
      filter="url(#softCreaseGlow)"
    />

    <!-- Intense Central Hot Filament Spark -->
    <path
      d="M 22, -45 
             C 18, -15 12, 0 6, 12 
             C -2, 26 -14, 45 -18, 62"
      fill="none"
      stroke="#FFF2E8"
      stroke-width="2.2"
      stroke-linecap="round"
      opacity="0.9"
    />
  </g>

  <!-- 4. Right Side: Typography Lockup -->
  <!-- "ember" (Bricolage Grotesque 800, crema #FAF6F1) -->
  <!-- "ROASTERY" (wide letter-spacing, ember #E4572E) -->
  <!-- Arabic: "قهوة مختصة، محمصة بعناية" in crema (#FAF6F1) -->
  <g transform="translate(680, 0)">
    <!-- ember wordmark -->
    <text
      x="0"
      y="278"
      font-family="'Bricolage Grotesque', system-ui, -apple-system, sans-serif"
      font-size="124"
      font-weight="800"
      letter-spacing="-3.5"
      fill="#FAF6F1"
    >
      ember
    </text>

    <!-- ROASTERY line -->
    <text
      x="6"
      y="348"
      font-family="'Bricolage Grotesque', system-ui, -apple-system, sans-serif"
      font-size="28"
      font-weight="700"
      letter-spacing="12"
      fill="#E4572E"
    >
      ROASTERY
    </text>

    <!-- Arabic descriptor line -->
    <!-- "قهوة مختصة، محمصة بعناية" in crema (#FAF6F1) -->
    <text
      x="6"
      y="440"
      font-family="'IBM Plex Sans Arabic', 'Segoe UI', Tahoma, sans-serif"
      font-size="36"
      font-weight="500"
      letter-spacing="0"
      fill="#FAF6F1"
      opacity="0.92"
    >
      قهوة مختصة، محمصة بعناية
    </text>
  </g>
</svg>
